<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lishan Sarees - Premium Logo Design</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-brown: #2C1810;
            --gold-primary: #D4AF37;
            --gold-light: #F9E29C;
            --gold-dark: #A67C00;
            --cream-bg: #FDFBF7;
            --text-color: #333;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--cream-bg);
            font-family: 'Playfair Display', serif;
        }

        .logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
            padding: 60px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.05);
            transition: transform 0.3s ease;
        }

        .logo-container:hover {
            transform: translateY(-5px);
        }

        /* The Rounded Square Box */
        .logo-box {
            width: 140px;
            height: 140px;
            background-color: var(--deep-brown);
            border-radius: 20px;
            border: 3px solid var(--gold-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 
                0 10px 25px rgba(0,0,0,0.3),
                inset 0 0 15px rgba(0,0,0,0.5),
                inset 0 0 2px 1px var(--gold-light);
            overflow: hidden;
        }

        /* Gold Embossed Initials */
        .initials {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 72px;
            font-weight: 700;
            background: linear-gradient(
                145deg, 
                var(--gold-light) 0%, 
                var(--gold-primary) 45%, 
                var(--gold-dark) 55%, 
                var(--gold-light) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(2px 3px 2px rgba(0,0,0,0.6));
            position: relative;
            z-index: 2;
            letter-spacing: -2px;
        }

        /* Subtle Shine Effect */
        .logo-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.1) 50%,
                transparent 55%
            );
            animation: moveShine 4s infinite linear;
            pointer-events: none;
        }

        @keyframes moveShine {
            0% { transform: translate(-15%, -15%); }
            100% { transform: translate(15%, 15%); }
        }

        /* Brand Text Outside */
        .brand-text-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .brand-name {
            font-family: 'Playfair Display', serif;
            font-size: 42px;
            font-weight: 700;
            color: var(--deep-brown);
            margin: 0;
            letter-spacing: 1px;
            line-height: 1;
        }

        .brand-tagline {
            font-family: 'Cinzel', serif;
            font-size: 14px;
            font-weight: 400;
            color: var(--gold-dark);
            margin: 8px 0 0 0;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        /* Decorative line */
        .decorative-line {
            width: 40px;
            height: 1px;
            background: var(--gold-primary);
            margin: 15px 0;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="logo-container" id="lishan-logo">
        <div class="logo-box">
            <span class="initials">LS</span>
        </div>
        <div class="brand-text-container">
            <h1 class="brand-name">Lishan</h1>
            <div class="decorative-line"></div>
            <p class="brand-tagline">Sarees</p>
        </div>
    </div>

</body>
</html>
